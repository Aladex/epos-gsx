# WirePlumber 0.5+ (SPA-JSON configuration). Install as
# /etc/wireplumber/wireplumber.conf.d/51-epos-gsx1000-v2.conf (see README).
# Binds the custom ACP profile set to the GSX 1000 v2 by USB vendor and product id,
# so it applies to every unit regardless of its device string.

monitor.alsa.rules = [
  {
    matches = [
      { device.vendor.id = "0x1395", device.product.id = "0x00b1" }
    ]
    actions = {
      update-props = {
        device.profile-set = "/etc/alsa-card-profile/mixer/profile-sets/epos-gsx1000-v2.conf"
      }
    }
  }
]
